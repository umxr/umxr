<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Umar Gora — Software Engineer, Builder, Community Maker</title>
  <desc id="desc">Raycast-inspired command palette showing Umar Gora as a selected search result with status "Available" and co-founder of Deen Developers.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#070809"/>
    </linearGradient>

    <linearGradient id="row-hl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8a31726"/>
      <stop offset="70%" stop-color="#e8a3170a"/>
      <stop offset="100%" stop-color="#e8a31700"/>
    </linearGradient>

    <linearGradient id="card-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur-lg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#1a1f26"/>
    </pattern>

    <clipPath id="card-clip">
      <rect width="1000" height="280" rx="14"/>
    </clipPath>

    <style>
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)" opacity="0.55"/>

  <!-- Ambient colored glows -->
  <circle cx="160" cy="40" r="220" fill="#e8a317" opacity="0.10" filter="url(#blur-lg)"/>
  <circle cx="1060" cy="300" r="240" fill="#3b82f6" opacity="0.06" filter="url(#blur-lg)"/>

  <!-- Corner registration marks -->
  <g stroke="#e8a317" stroke-width="1" fill="none" opacity="0.35">
    <path d="M 20 20 L 20 36 M 20 20 L 36 20"/>
    <path d="M 1180 20 L 1180 36 M 1180 20 L 1164 20"/>
    <path d="M 20 300 L 20 284 M 20 300 L 36 300"/>
    <path d="M 1180 300 L 1180 284 M 1180 300 L 1164 300"/>
  </g>

  <!-- Edge labels (terminal-feel) -->
  <text x="48" y="26" class="mono" font-size="9" fill="#484f58" letter-spacing="3">01 · IDENTITY</text>
  <text x="1152" y="26" text-anchor="end" class="mono" font-size="9" fill="#484f58" letter-spacing="3">2026 ©</text>

  <!-- Command palette card -->
  <g transform="translate(100, 20)" filter="url(#soft-shadow)">
    <g clip-path="url(#card-clip)">
      <!-- Card body -->
      <rect width="1000" height="280" fill="#0d1117"/>
      <!-- Subtle top bevel -->
      <rect width="1000" height="140" fill="url(#card-bevel)"/>

      <!-- === HEADER: search bar === -->
      <g>
        <!-- Search icon -->
        <g transform="translate(24, 22)" stroke="#8b949e" stroke-width="1.5" fill="none" stroke-linecap="round">
          <circle cx="9" cy="9" r="7"/>
          <line x1="14.5" y1="14.5" x2="19" y2="19"/>
        </g>

        <!-- Typed query + hint -->
        <text x="58" y="37" class="mono" font-size="15" fill="#e6edf3">umar<tspan fill="#484f58"> — software engineer, builder, community maker</tspan></text>

        <!-- Blinking cursor -->
        <rect x="97" y="22" width="1.6" height="18" fill="#e8a317">
          <animate attributeName="opacity" values="1;1;0;0" dur="1.05s" repeatCount="indefinite"/>
        </rect>

        <!-- ⌘K hint (two keycaps) -->
        <g transform="translate(902, 16)">
          <rect width="30" height="28" rx="7" fill="#151b23" stroke="#2a313b" stroke-width="1"/>
          <rect x="0.5" y="0.5" width="29" height="6" rx="6.5" fill="#ffffff" opacity="0.03"/>
          <text x="15" y="19" text-anchor="middle" class="mono" font-size="12" fill="#c9d1d9">⌘</text>
          <rect x="38" width="30" height="28" rx="7" fill="#151b23" stroke="#2a313b" stroke-width="1"/>
          <rect x="38.5" y="0.5" width="29" height="6" rx="6.5" fill="#ffffff" opacity="0.03"/>
          <text x="53" y="19" text-anchor="middle" class="mono" font-size="12" fill="#c9d1d9">K</text>
        </g>
      </g>

      <!-- Divider -->
      <line x1="0" y1="62" x2="1000" y2="62" stroke="#21262d"/>

      <!-- === CATEGORY: PEOPLE === -->
      <text x="24" y="86" class="mono" font-size="10" fill="#6e7681" letter-spacing="2.5">PEOPLE</text>
      <text x="976" y="86" text-anchor="end" class="mono" font-size="10" fill="#484f58" letter-spacing="2">1 RESULT</text>

      <!-- Selected row highlight -->
      <rect x="14" y="94" width="972" height="62" rx="9" fill="url(#row-hl)"/>
      <rect x="14.5" y="94.5" width="971" height="61" rx="8.5" fill="none" stroke="#e8a317" stroke-width="1" opacity="0.32"/>
      <!-- left accent bar -->
      <rect x="14" y="106" width="3" height="38" fill="#e8a317" rx="1.5"/>

      <!-- Avatar (amber chip with initials) -->
      <g transform="translate(36, 107)">
        <rect width="38" height="38" rx="10" fill="#e8a317"/>
        <rect x="0.5" y="0.5" width="37" height="12" rx="9.5" fill="#ffffff" opacity="0.18"/>
        <text x="19" y="25" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#1a1204" letter-spacing="0.5">UG</text>
      </g>

      <!-- Name -->
      <text x="86" y="121" class="sans" font-size="19" font-weight="600" fill="#e6edf3" letter-spacing="-0.2">Umar Gora</text>
      <!-- Role strip -->
      <text x="86" y="143" class="mono" font-size="11" fill="#8b949e">Software Engineer<tspan fill="#30363d"> · </tspan>Builder<tspan fill="#30363d"> · </tspan>Community Maker</text>

      <!-- Right-side: available pill + location -->
      <g transform="translate(976, 112)">
        <g transform="translate(-138, 0)">
          <rect width="132" height="22" rx="11" fill="#0a0c10" stroke="#1f2a1f"/>
          <circle cx="13" cy="11" r="3" fill="#3fb950">
            <animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" repeatCount="indefinite"/>
          </circle>
          <text x="24" y="15" class="mono" font-size="10" fill="#3fb950" letter-spacing="1">AVAILABLE</text>
        </g>
      </g>
      <text x="976" y="150" text-anchor="end" class="mono" font-size="10" fill="#484f58" letter-spacing="1.2">WEST YORKSHIRE, UK</text>

      <!-- === CATEGORY: ORGANIZATIONS === -->
      <text x="24" y="184" class="mono" font-size="10" fill="#6e7681" letter-spacing="2.5">ORGANIZATIONS</text>
      <text x="976" y="184" text-anchor="end" class="mono" font-size="10" fill="#484f58" letter-spacing="2">2 RESULTS</text>

      <!-- Org row 1: NearForm -->
      <g transform="translate(14, 192)">
        <rect width="479" height="44" rx="9" fill="transparent" stroke="#1a1f26"/>
        <rect x="12" y="6" width="32" height="32" rx="8" fill="#151b23" stroke="#2a313b"/>
        <text x="28" y="27" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#8b949e">NF</text>
        <text x="56" y="21" class="sans" font-size="13" font-weight="500" fill="#c9d1d9">NearForm</text>
        <text x="56" y="36" class="mono" font-size="10" fill="#484f58">Software Engineer · Remote</text>
        <text x="466" y="27" text-anchor="end" class="mono" font-size="9" fill="#484f58">nearform.com</text>
      </g>

      <!-- Org row 2: Deen Developers -->
      <g transform="translate(507, 192)">
        <rect width="479" height="44" rx="9" fill="transparent" stroke="#1a1f26"/>
        <rect x="12" y="6" width="32" height="32" rx="8" fill="#151b23" stroke="#2a313b"/>
        <text x="28" y="27" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#8b949e">DD</text>
        <text x="56" y="21" class="sans" font-size="13" font-weight="500" fill="#c9d1d9">Deen Developers</text>
        <text x="56" y="36" class="mono" font-size="10" fill="#484f58">Co-founder · Community</text>
        <text x="466" y="27" text-anchor="end" class="mono" font-size="9" fill="#484f58">deendevelopers.com</text>
      </g>

      <!-- Bottom action bar -->
      <rect x="0" y="244" width="1000" height="36" fill="#08090c"/>
      <line x1="0" y1="244" x2="1000" y2="244" stroke="#21262d"/>

      <g transform="translate(24, 263)" class="mono" font-size="11">
        <!-- ↵ Open -->
        <rect x="0" y="-10" width="22" height="18" rx="4" fill="#151b23" stroke="#2a313b"/>
        <text x="11" y="3" text-anchor="middle" fill="#c9d1d9">↵</text>
        <text x="30" y="3" fill="#8b949e">Open Profile</text>

        <line x1="138" y1="-10" x2="138" y2="8" stroke="#21262d"/>

        <!-- ⌘ Actions -->
        <rect x="154" y="-10" width="22" height="18" rx="4" fill="#151b23" stroke="#2a313b"/>
        <text x="165" y="3" text-anchor="middle" fill="#c9d1d9">⌘</text>
        <text x="184" y="3" fill="#8b949e">Actions</text>

        <line x1="252" y1="-10" x2="252" y2="8" stroke="#21262d"/>

        <!-- esc -->
        <rect x="268" y="-10" width="34" height="18" rx="4" fill="#151b23" stroke="#2a313b"/>
        <text x="285" y="3" text-anchor="middle" fill="#c9d1d9" font-size="9">ESC</text>
        <text x="310" y="3" fill="#8b949e">Close</text>
      </g>

      <text x="976" y="266" text-anchor="end" class="mono" font-size="10" fill="#484f58" letter-spacing="1.5">UMXR · v.2026</text>
    </g>

    <!-- Card border (on top, not clipped) -->
    <rect x="0.5" y="0.5" width="999" height="279" rx="13.5" fill="none" stroke="#21262d"/>
    <rect x="1" y="1" width="998" height="1" fill="#ffffff" opacity="0.05"/>
  </g>

  <!-- Hairline beneath card -->
  <rect x="100" y="305" width="1000" height="1" fill="#e8a317" opacity="0.12"/>
</svg>
