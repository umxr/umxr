<svg viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="40%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%">
        <animate attributeName="stop-color" values="#e8a317;#3b82f6;#10b981;#e8a317" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%">
        <animate attributeName="stop-color" values="#3b82f6;#10b981;#e8a317;#3b82f6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%">
        <animate attributeName="stop-color" values="#10b981;#e8a317;#3b82f6;#10b981" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%">
        <animate attributeName="stop-color" values="#e8a31720;#3b82f620;#10b98120;#e8a31720" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%">
        <animate attributeName="stop-color" values="#10b98120;#e8a31720;#3b82f620;#10b98120" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" rx="10"/>

  <!-- Ambient glow behind text -->
  <ellipse cx="600" cy="95" rx="300" ry="60" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Grid pattern (subtle) -->
  <line x1="200" y1="0" x2="200" y2="200" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>
  <line x1="400" y1="0" x2="400" y2="200" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>
  <line x1="600" y1="0" x2="600" y2="200" stroke="#1e293b" stroke-width="0.5" opacity="0.2"/>
  <line x1="800" y1="0" x2="800" y2="200" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>
  <line x1="1000" y1="0" x2="1000" y2="200" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="65" x2="1200" y2="65" stroke="#1e293b" stroke-width="0.5" opacity="0.2"/>
  <line x1="0" y1="130" x2="1200" y2="130" stroke="#1e293b" stroke-width="0.5" opacity="0.2"/>

  <!-- Floating particles -->
  <circle cx="90" cy="35" r="2" fill="#e8a317" opacity="0.4">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="35;30;35" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="60" r="1.2" fill="#3b82f6" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="5s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="cy" values="60;55;60" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="150" r="1.5" fill="#10b981" opacity="0.25">
    <animate attributeName="opacity" values="0.1;0.35;0.1" dur="6s" repeatCount="indefinite" begin="2s"/>
  </circle>

  <circle cx="1110" cy="45" r="1.8" fill="#3b82f6" opacity="0.35">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="5s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="cy" values="45;40;45" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="160" r="1.3" fill="#e8a317" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4.5s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <circle cx="1140" cy="130" r="2" fill="#10b981" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.35;0.1" dur="6s" repeatCount="indefinite" begin="3s"/>
    <animate attributeName="cy" values="130;125;130" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Connector lines between particles -->
  <line x1="90" y1="35" x2="150" y2="60" stroke="#e8a317" stroke-width="0.5" opacity="0.1"/>
  <line x1="150" y1="60" x2="70" y2="150" stroke="#3b82f6" stroke-width="0.5" opacity="0.08"/>
  <line x1="1110" y1="45" x2="1050" y2="160" stroke="#3b82f6" stroke-width="0.5" opacity="0.1"/>
  <line x1="1050" y1="160" x2="1140" y2="130" stroke="#e8a317" stroke-width="0.5" opacity="0.08"/>

  <!-- Border with animated gradient -->
  <rect x="0.5" y="0.5" width="1199" height="199" fill="none" stroke="url(#accent)" stroke-width="1" rx="10" opacity="0.15"/>

  <!-- Name -->
  <text x="600" y="88" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="44" font-weight="700" fill="#e6edf3" letter-spacing="3">UMAR GORA</text>

  <!-- Accent bar -->
  <rect x="380" y="108" width="440" height="2" fill="url(#accent)" rx="1">
    <animate attributeName="width" values="0;440" dur="1.5s" fill="freeze"/>
    <animate attributeName="x" values="600;380" dur="1.5s" fill="freeze"/>
  </rect>

  <!-- Tagline -->
  <text x="600" y="148" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="13" fill="#8b949e" letter-spacing="4">SOFTWARE ENGINEER  ·  BUILDER  ·  COMMUNITY MAKER</text>

  <!-- Location tag -->
  <text x="600" y="175" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="10" fill="#484f58" letter-spacing="2">WEST YORKSHIRE, UK</text>
</svg>
